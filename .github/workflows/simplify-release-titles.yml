name: Simplify release presentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/simplify-release-titles.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Use version titles and link release details to README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}
          releases = json.loads("[{\"id\":452799018,\"tag\":\"v0.9.20\"},{\"id\":452798976,\"tag\":\"v0.9.19\"},{\"id\":452798929,\"tag\":\"v0.9.18\"},{\"id\":452798900,\"tag\":\"v0.9.17\"},{\"id\":452798857,\"tag\":\"v0.9.16\"},{\"id\":452798800,\"tag\":\"v0.9.15\"},{\"id\":452798763,\"tag\":\"v0.9.14\"},{\"id\":452798715,\"tag\":\"v0.9.13\"},{\"id\":452798677,\"tag\":\"v0.9.12\"},{\"id\":452798641,\"tag\":\"v0.9.11\"},{\"id\":452798604,\"tag\":\"v0.9.10\"},{\"id\":452798560,\"tag\":\"v0.9.9\"},{\"id\":452798519,\"tag\":\"v0.9.8\"},{\"id\":452798480,\"tag\":\"v0.9.7\"},{\"id\":452798441,\"tag\":\"v0.9.6\"},{\"id\":452798413,\"tag\":\"v0.9.5\"},{\"id\":452798369,\"tag\":\"v0.9.4\"},{\"id\":452798332,\"tag\":\"v0.9.3\"},{\"id\":452798283,\"tag\":\"v0.9.2\"},{\"id\":452798242,\"tag\":\"v0.9.1\"},{\"id\":452798201,\"tag\":\"v0.9.0\"},{\"id\":452798147,\"tag\":\"v0.8.96\"},{\"id\":452798117,\"tag\":\"v0.8.95\"},{\"id\":452798067,\"tag\":\"v0.8.94\"},{\"id\":452798027,\"tag\":\"v0.8.93\"},{\"id\":452797969,\"tag\":\"v0.8.92\"},{\"id\":452797932,\"tag\":\"v0.8.91\"},{\"id\":452797886,\"tag\":\"v0.8.90\"},{\"id\":452797826,\"tag\":\"v0.8.89\"},{\"id\":452797802,\"tag\":\"v0.8.88\"},{\"id\":452797757,\"tag\":\"v0.8.64\"},{\"id\":452797703,\"tag\":\"v0.8.63\"},{\"id\":452797655,\"tag\":\"v0.8.62\"},{\"id\":452797622,\"tag\":\"v0.8.61\"},{\"id\":452797574,\"tag\":\"v0.8.60\"},{\"id\":452797529,\"tag\":\"v0.8.59\"},{\"id\":452797485,\"tag\":\"v0.8.58\"},{\"id\":452797434,\"tag\":\"v0.8.55\"},{\"id\":452797395,\"tag\":\"v0.8.54\"}]")
          for release in releases:
              body = "[Patch notes and installation](https://github.com/" + repo + "/blob/main/README.md#patch-notes) · [All patches](https://github.com/" + repo + "/blob/main/PATCHES.md)"
              data = json.dumps({"name": release["tag"], "body": body}).encode()
              url = "https://api.github.com/repos/" + repo + "/releases/" + str(release["id"])
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers, method="PATCH"), timeout=60) as response:
                  updated = json.load(response)
              assert updated["name"] == release["tag"] and updated["tag_name"] == release["tag"]
              assert updated["body"] == body
              print("Updated " + release["tag"], flush=True)
          
          PY
